runs:
  using: composite
  steps:
    # Python 3.9 dropped support for Windows 7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.8'
        cache: 'pip' # caching pip dependencies

    - run: python -m venv .venv
      shell: bash

    # I hate Windows, create a symlink called bin that points to Scripts
    - name: Create Virtual Environment
      run: |
        if [ -d ".venv/Scripts" ] && [ ! -d ".venv/bin" ]; then
          ln -s Scripts .venv/bin
        fi
      if: runner.os == 'Windows'
      shell: bash

    - run: .venv/bin/pip install -r src/installer/requirements.txt 2>&1
      shell: bash

    # check syntax and run tests
    - run: .venv/bin/python -m compileall -q . 2>&1
      shell: bash
    - run: .venv/bin/python src/installer/tests.py 2>&1
      shell: bash

    - name: Build
      run: .venv/bin/python src/installer/build.py
      shell: bash
    - run: du -ha src/installer/dist
      shell: bash

    - run: cat src/installer/build/installer/warn-installer.txt
      shell: bash

    # small test, use timeouts because on windows the GUI can catch errors and a dialog box will freeze the program
    - run: timeout 30 ./src/installer/dist/DXRandoInstaller --version --verbose 2>&1
      shell: bash
    - run: timeout 30 ./src/installer/dist/BingoViewer --version 2>&1
      shell: bash

    # make sure we got everything
    - run: find src/installer/3rdParty/
      shell: bash
    - run: find src/installer/dist/
      shell: bash
    - run: ls -lah src/installer/dist/
      shell: bash
